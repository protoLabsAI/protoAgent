# First boot copies this seed into /sandbox/config/langgraph-config.yaml.
# Persist /sandbox to keep console edits across container replacements.
# PROTOAGENT_SEED_MERGE=1 applies later seed changes while keeping operator edits.
# The legacy model block below reads its credential from OPENAI_API_KEY.
# Keep secrets out of this seed and the image.
identity:
  name: my-agent

model:
  provider: openai
  name: gpt-4o-mini
  api_base: https://api.openai.com/v1   # OPENAI_API_KEY supplies the key (env)

plugins:
  enabled: []   # e.g. [notes, docs] — bundled plugins, or ones you've installed
