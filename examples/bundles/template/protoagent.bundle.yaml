# A protoAgent plugin BUNDLE (ADR 0040) with the PIN LIFECYCLE baked in (ADR 0049).
# Copy this repo layout to publish your own bundle:  protoagent.bundle.yaml at the
# root + scripts/ + .github/workflows/verify-bundle.yml.   Install:
#   python -m server plugin install <this-repo-url>
#
# THE PIN RULES (ADR 0049 — what keeps this bundle from rotting):
#
#   1. Pin release TAGS, not raw SHAs. A tag is legible ("pinned v0.1.0, v0.1.2
#      available"), ls-remote-able (the console's update advisory can see it), and it
#      nudges plugin repos toward a release discipline. The installer still locks the
#      resolved commit SHA in plugins.lock — the tag is the *requested* ref, the lock
#      stays the reproducibility truth. Raw SHAs remain fine for unreleased forks.
#   2. Record `verified_against:` — the core version this exact pin set was last
#      verified on. Metadata, not a gate: tooling surfaces it, nothing enforces it.
#   3. Never bump a pin by hand-editing alone — let CI prove it. The verify workflow
#      installs THIS manifest into a scratch agent and probes every declared console
#      view; the scheduled leg opens a pin-bump PR when a member tags a new release.
#      A pin that only moves through a passing verify literally means "last verified
#      working".
#
# KEEP MEMBER ENTRIES ON ONE LINE — scripts/check_bundle_updates.py rewrites the
# `ref:` token in place (comment-preserving) and expects the `- { id, url, ref }`
# inline form below.

id: my-archetype
name: My Archetype
description: >-
  One-line pitch for the composed agent this bundle stands up.

# The core version this pin set was last verified against (rule 2). The verify
# workflow checks out this protoAgent ref for the smoke, so the claim is tested,
# not aspirational. Bump it when you re-verify on a newer core.
verified_against: 0.35.3

plugins:
  - { id: delegates, builtin: true }                                                  # ships with protoAgent
  - { id: project_board, url: https://github.com/protoLabsAI/projectBoard-plugin,  ref: v0.1.1 }
  - { id: agent_browser, url: https://github.com/protoLabsAI/agent-browser-plugin, ref: v0.1.1 }

enabled: [delegates, project_board, agent_browser]   # suggested turn-on list (you apply it)
config:                                              # recommended defaults (you apply them)
  agent_browser:
    panel_mode: full

# MCP servers to seed into a new agent (ADR 0083 D5, #2011). Each item is catalog-shaped
# (like config/mcp-catalog.json rows): a `template` (an mcp.servers entry, transport
# stdio|http|streamable_http|sse) plus optional `inputs`. A `${key}` placeholder in the
# template is filled AT CREATE TIME from that input's `env` var (or `default`). An entry
# whose *required* input has no value at seed time is added `enabled: false` — it shows up
# in the agent's MCP panel, inert, for the operator to finish. `config: {mcp: ...}` can't do
# this (its overlay merges dict leaves, not the `mcp.servers` list), which is why `mcp:` is
# its own field. Omit the whole block if your bundle seeds no MCP servers.
mcp:
  # A path-input example (uvx/Python). Note what is NOT here: the third-party
  # @modelcontextprotocol/server-filesystem. protoAgent ships its own fenced filesystem
  # tools (ADR 0007, `filesystem.projects`), so seeding that server duplicates them —
  # and its unbounded `search_files` has wedged a real turn. Reach for `filesystem.projects`.
  - template: { name: git, transport: stdio, command: uvx,
                args: ["mcp-server-git", "--repository", "${path}"] }
    inputs:
      - { key: path, env: PROTOAGENT_MCP_GIT_REPO, default: "~", required: true }
  - template: { name: github, transport: http, url: "https://api.githubcopilot.com/mcp/",
                headers: { Authorization: "Bearer ${token}" } }
    inputs:
      - { key: token, env: GITHUB_MCP_TOKEN, required: true, secret: true }

# Standalone secrets the bundle's plugins need (#2041) — same input shape as an
# mcp-catalog row. Cached in plugins.lock so the create/install surfaces (fleet
# new-agent Configure step, setup wizard, POST /api/plugins/install) can prompt for
# each and write it to the agent's secrets.yaml (0600, merge-not-clobber). A value the
# operator skips falls back to the environment. Omit if your plugins declare their
# secrets in their own manifests and need nothing bundle-level.
secrets:
  - { key: acme_api_key, label: "Acme API key", placeholder: "ak-…", secret: true, required: false }

# Create-time Configure step (#2934) — questions the Setup Wizard / New Agent panel asks
# BEFORE the agent exists, written into its config at the dotted keys. `required: true`
# is a hard gate (a create with no answer is refused, naming the prompt). A `delegate`
# answer is COPIED from the host into the new member's own registry; a `path` answer
# flagged `project: true` is registered as a managed project (ADR 0095 `projects:` +
# GitHub slug from its origin remote + a scoped `onboarding.root`). Older cores ignore
# the whole block; `project:` is ignored by cores that predate it.
config_inputs:
  - { key: my_board.repo,  label: "Repo this board manages (absolute path)", type: path, required: true, project: true }
  - { key: my_board.coder, label: "Coder delegate the board dispatches to",  type: delegate, required: true }
  - { key: my_board.loop_enabled, label: "Start the loop now", type: boolean, default: false }

# Agent archetype (ADR 0042) — presents this bundle as a starter "agent type" in the
# new-agent picker. Additive metadata; it doesn't change the bundle shape. Unknown
# keys warn at install (#2715) — the full set is below.
archetype:
  label: My Archetype
  icon: Boxes
  blurb: One-line pitch shown on the archetype card.
  # Persona: inline `soul` (markdown) OR `soul_preset` (a stem under the host's
  # config/soul-presets/ — warns + falls back to the base persona if the host
  # doesn't ship it). Omit both and a created agent keeps the default persona.
  # soul: |
  #   # My Archetype operator
  #   …
  # soul_preset: cowork
  # Picker placement: "standard" (default, renders inline) or "advanced"
  # (collapses under the picker's "Advanced (N)" toggle).
  # tier: standard
  # Host capabilities the archetype needs to be USEFUL (#2186) — the picker warns
  # at choose-time when one isn't provisioned. e.g. python_runtime.
  # requires: [python_runtime]
  # Capability contract (#2277): tool names the persona commits to using. Persisted
  # to the created agent's workspace.yaml; the member warns at boot when its bound
  # toolset doesn't cover the contract.
  # requires_tools: [github_create_issue]
