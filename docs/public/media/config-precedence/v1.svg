<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Settings resolve through three layers</title><desc id="desc">Later configured values override earlier layers; nested maps merge and lists replace. Environment rules are field-specific; they are not one universal final layer. Secrets use separate overlays.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5865cc" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f5f7fb"/><g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="57" fill="#182437" font-size="32" font-weight="700"><tspan x="48" dy="0">Settings resolve through three layers</tspan></text>
<text x="48" y="103" fill="#4b5870" font-size="20" font-weight="400"><tspan x="48" dy="0">Later configured values override earlier layers; nested maps merge and lists replace.</tspan></text>
<rect x="48" y="160" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="66" y="197" fill="#182437" font-size="21" font-weight="600"><tspan x="66" dy="0">1 · App defaults</tspan></text>
<path d="M401 212 H417" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="423" y="160" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="441" y="197" fill="#182437" font-size="21" font-weight="400"><tspan x="441" dy="0">2 · Host configuration</tspan></text>
<path d="M776 212 H792" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="798" y="160" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="816" y="197" fill="#182437" font-size="21" font-weight="400"><tspan x="816" dy="0">3 · Agent configuration</tspan></text>
<rect x="48" y="292" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="66" y="329" fill="#182437" font-size="21" font-weight="600"><tspan x="66" dy="0">Built-in defaults</tspan></text>
<path d="M401 344 H417" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="423" y="292" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="441" y="329" fill="#182437" font-size="21" font-weight="400"><tspan x="441" dy="0">&lt;box_root&gt;/host-config.yaml</tspan></text>
<path d="M776 344 H792" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="798" y="292" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="816" y="329" fill="#182437" font-size="21" font-weight="400"><tspan x="816" dy="0">&lt;instance_root&gt;/config/langg</tspan><tspan x="816" dy="29">raph-config.yaml</tspan></text>
<rect x="48" y="424" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="66" y="461" fill="#182437" font-size="21" font-weight="600"><tspan x="66" dy="0">Inspect the effective result</tspan></text>
<path d="M401 476 H417" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="423" y="424" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="441" y="461" fill="#182437" font-size="21" font-weight="400"><tspan x="441" dy="0">protoagent config explain</tspan></text>
<path d="M776 476 H792" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="798" y="424" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="816" y="461" fill="#182437" font-size="21" font-weight="400"><tspan x="816" dy="0">Read each field’s provenance</tspan></text>
<text x="48" y="594" fill="#4b5870" font-size="19" font-weight="400"><tspan x="48" dy="0">Environment rules are field-specific; they are not one universal final layer. Secrets use separate</tspan><tspan x="48" dy="29">overlays.</tspan></text>
</g></svg>
