<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Route public traffic deliberately</title><desc id="desc">A proxy rule and an application credential solve different problems. Keep the agent privately bound. Public plugin routes are deliberate exceptions, not a reason to expose /api.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5865cc" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f5f7fb"/><g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="57" fill="#182437" font-size="32" font-weight="700"><tspan x="48" dy="0">Route public traffic deliberately</tspan></text>
<text x="48" y="103" fill="#4b5870" font-size="20" font-weight="400"><tspan x="48" dy="0">A proxy rule and an application credential solve different problems.</tspan></text>
<rect x="48" y="160" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="66" y="197" fill="#182437" font-size="21" font-weight="600"><tspan x="66" dy="0">Public A2A hostname</tspan></text>
<path d="M401 212 H417" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="423" y="160" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="441" y="197" fill="#182437" font-size="21" font-weight="400"><tspan x="441" dy="0">Card: discovery · /a2a:</tspan><tspan x="441" dy="29">bearer</tspan></text>
<path d="M776 212 H792" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="798" y="160" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="816" y="197" fill="#182437" font-size="21" font-weight="400"><tspan x="816" dy="0">Block /app, /api, /metrics</tspan></text>
<rect x="48" y="292" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="66" y="329" fill="#182437" font-size="21" font-weight="600"><tspan x="66" dy="0">Separate console hostname</tspan></text>
<path d="M401 344 H417" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="423" y="292" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="441" y="329" fill="#182437" font-size="21" font-weight="400"><tspan x="441" dy="0">HTTPS proxy / optional</tspan><tspan x="441" dy="29">access gate</tspan></text>
<path d="M776 344 H792" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="798" y="292" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="816" y="329" fill="#182437" font-size="21" font-weight="400"><tspan x="816" dy="0">App + API still require</tspan><tspan x="816" dy="29">credentials</tspan></text>
<rect x="48" y="424" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="66" y="461" fill="#182437" font-size="21" font-weight="600"><tspan x="66" dy="0">Optional plugin webhook</tspan></text>
<path d="M401 476 H417" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="423" y="424" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="441" y="461" fill="#182437" font-size="21" font-weight="400"><tspan x="441" dy="0">Explicitly allow only its</tspan><tspan x="441" dy="29">route</tspan></text>
<path d="M776 476 H792" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="798" y="424" width="350" height="104" rx="12" fill="white" stroke="#cdd4e3"/>
<text x="816" y="461" fill="#182437" font-size="21" font-weight="400"><tspan x="816" dy="0">Plugin verifies its</tspan><tspan x="816" dy="29">signature</tspan></text>
<text x="48" y="594" fill="#4b5870" font-size="19" font-weight="400"><tspan x="48" dy="0">Keep the agent privately bound. Public plugin routes are deliberate exceptions, not a reason to expose</tspan><tspan x="48" dy="29">/api.</tspan></text>
</g></svg>
