<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Plugin code crosses two different boundaries</title><desc id="desc">Backend Python is trusted server code; the view uses the iframe bridge. Python plugins run with server privileges. An iframe boundary does not sandbox the plugin backend.</desc>
