<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">One box, separate instance roots</title><desc id="desc">Example: PROTOAGENT_BOX_ROOT=/srv/agents with alice and bob instance IDs. commons/ is opt-in shared material. PROTOAGENT_HOME overrides the instance root; check store overrides too.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5865cc" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f5f7fb"/><g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="57" fill="#182437" font-size="32" font-weight="700"><tspan x="48" dy="0">One box, separate instance roots</tspan></text>
<text x="48" y="103" fill="#4b5870" font-size="20" font-weight="400"><tspan x="48" dy="0">Example: PROTOAGENT_BOX_ROOT=/srv/agents with alice and bob instance IDs.</tspan></text>
<rect x="48" y="145" width="1100" height="405" rx="16" fill="#edf0ff" stroke="#cdd4e3"/>
<text x="70" y="180" fill="#182437" font-size="23" font-weight="700"><tspan x="70" dy="0">/srv/agents/  ·  box root</tspan></text>
<rect x="80" y="207" width="1036" height="86" rx="12" fill="#ffffff" stroke="#cdd4e3"/>
<text x="98" y="242" fill="#182437" font-size="21" font-weight="400"><tspan x="98" dy="0">host-config.yaml  ·  defaults inherited by both instances</tspan></text>
<rect x="80" y="343" width="490" height="86" rx="12" fill="#ffffff" stroke="#cdd4e3"/>
<text x="98" y="378" fill="#182437" font-size="21" font-weight="400"><tspan x="98" dy="0">alice/config/ + workspace/ + private</tspan><tspan x="98" dy="29">stores</tspan></text>
<rect x="626" y="343" width="490" height="86" rx="12" fill="#ffffff" stroke="#cdd4e3"/>
<text x="644" y="378" fill="#182437" font-size="21" font-weight="400"><tspan x="644" dy="0">bob/config/ + workspace/ + private</tspan><tspan x="644" dy="29">stores</tspan></text>
<path d="M325 293 V335" fill="none" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M871 293 V335" fill="none" stroke="#5865cc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="80" y="488" fill="#182437" font-size="21" font-weight="400"><tspan x="80" dy="0">commons/  ·  explicitly shared material; private stores remain separate</tspan></text>
<text x="48" y="594" fill="#4b5870" font-size="19" font-weight="400"><tspan x="48" dy="0">commons/ is opt-in shared material. PROTOAGENT_HOME overrides the instance root; check store overrides</tspan><tspan x="48" dy="29">too.</tspan></text>
</g></svg>
