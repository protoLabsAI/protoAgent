<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">The server owns the agent and its data</title><desc id="desc">Choose a deployment; the browser is a client in each case. Protect remote access with authentication. Keep storage beside the server; back up its instance data.</desc>
