[project]
name = "protoagent-acp"
version = "0.1.0"
description = "Use a running protoAgent instance as an ACP agent in Zed (or any ACP client): a stdio ACP server that is a pure A2A client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "protoLabs AI" }]
dependencies = [
  # The official ACP Python SDK. 0.x — pinned to the minor we built against; the
  # schema module is generated and its class names moved between minors.
  "agent-client-protocol>=0.12.1,<0.13",
  "httpx>=0.27",
]

[project.scripts]
protoagent-acp = "protoagent_acp.cli:main"

[project.urls]
Repository = "https://github.com/protoLabsAI/protoAgent"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protoagent_acp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
