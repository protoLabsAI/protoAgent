<!doctype html>
<!-- Fixture for tests/test_agent_browser_gate_live.py: a job page with the controls the browser
     action gate must tell apart — an "Apply now" link, a search form, a non-submit button and
     the real Submit button. Submissions are counted in window.__submits, never sent. -->
<html><head><meta charset="utf-8"><title>Apply - Acme</title></head>
<body>
<a href="#apply" id="applynow">Apply now</a>
<form id="search" role="search" action="/search"><input type="search" name="q" aria-label="Search jobs"><button>Search</button></form>
<form id="app" action="/submit" method="post">
  <label for="name">Full name</label><input id="name" name="name">
  <label for="email">Email</label><input id="email" name="email" type="email">
  <button type="button" id="addmore" onclick="window.__added = (window.__added || 0) + 1">Add another</button>
  <button id="sub"><span>Submit application</span></button>
</form>
<script>
  window.__submits = 0;
  document.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.id === 'app') window.__submits += 1; });
</script>
</body></html>
