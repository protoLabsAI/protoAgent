<!doctype html>
<!--
  SAVED ATS FORM FIXTURE — Greenhouse application form (#4032 A5).

  Models the DOM contract of a Greenhouse-hosted job application form:
      https://job-boards.greenhouse.io/<company>/jobs/<id>
  (the public "Apply for this job" form served by job-boards.greenhouse.io).

  Captured / last modeled: 2026-10-05.

  This is a MINIMAL, self-contained reproduction — no network, no external JS/CSS —
  whose purpose is to exercise the agent_browser in-page form JavaScript (plugins/
  agent_browser/forms.py) in a real browser. What matters is the DOM contract and the
  interaction behaviors Greenhouse's widgets have, NOT a pixel copy:

    * text inputs with `<label for>` and required-asterisk markers;
    * react-select-style comboboxes: `.select__container` > `.select__control`
      holding an `input[role=combobox]`, an always-present `.select__single-value`
      showing the committed choice, and a `.select__menu` (id === the input's
      aria-controls) of `role=option` elements that is PORTALLED to <body> and exists
      ONLY while open. These model REAL react-select OPEN semantics so the open
      escalation (#4032 fix round) is actually exercised, not a toy that opens on any
      event: the control ignores a non-primary (button !== 0) mousedown; a mousedown
      while the input is NOT focused focuses it and opens via an `openAfterFocus`
      flag; a mousedown while focused and already open TOGGLES it closed; ArrowDown on
      the input opens. The first option is highlighted and Enter would commit it (the
      #4032 trap) — browser_select clicks the exact option instead. Behaviors are set
      per control by data-attributes:
        - `data-open="standard"` (default): opens on a synthetic button-0 mousedown
          (visa, country). Visa lists "Yes, Ireland Highly Skilled Worker Visa" FIRST
          (highlighted) then "Yes", so a type+Enter picks wrong; country lists
          "Afghanistan" first and includes "United States".
        - `data-open="arrowdown-or-trusted"` (sponsorship): IGNORES an untrusted
          mousedown (`if(!e.isTrusted) return`); opens only on ArrowDown or a trusted
          click — so the escalation must reach strategy (b)/the CLI click.
        - `data-open="type-to-search"` (primary skill): a TYPE-TO-SEARCH combobox whose
          listbox renders ONLY after input — a mousedown and ArrowDown never open it, so
          browser_select must TYPE the filter to open it (the pre-#4032 open path).
        - `data-open="trusted-only"` (security clearance): ignores untrusted mousedown
          AND has no ArrowDown handler; opens ONLY on a real (trusted) CLI click — the
          browser_select trusted-click fallback.
        - `data-open="never"` (preferred office): never opens on anything — the
          explicit "could not open the dropdown" error, not "no options were found".
        - `data-filter="value"` (how-did-you-hear): filters options by a hidden value,
          not the visible text, so typing the wanted option's text hides EVERYTHING —
          the unfiltered rescan must still find it.
    * an intl-tel-input phone field: `.iti` wrapper, a `.iti__selected-flag` whose
      `title` holds the committed country, and a `ul.iti__country-list` of
      `li.iti__country` (each `.iti__country-name`) with Afghanistan and Åland
      Islands first and United States present. Picking a country updates the flag's
      title; the national number is a plain `input[type=tel]`.
    * résumé + cover-letter blocks: each a hidden `input[type=file]` behind an "Attach"
      button (the input carries aria-labelledby=the button, so BOTH resolve the shared
      label "Attach" — which is why browser_upload addresses them by `#resume` /
      `#cover_letter` id, not the ambiguous label). On `change` the widget REPLACES its
      `input[type=file]` with a fresh one (same id/name, empty `files`) and renders a
      filename chip with a remove button — the live Greenhouse behavior that strands a
      nonce tagged on the OLD input, so browser_upload must verify via the new input's
      id/name or the chip (#4032 bug 3). The résumé block also has an "Enter manually"
      trigger whose textarea is revealed ONLY by a JS-dispatched (untrusted) click — a
      native CLI click reports success but does nothing, which is exactly the Greenhouse
      behavior browser_click(js_fallback=True) exists for.
    * a transcript block (`#transcript`) whose widget REJECTS the attach — on `change` it
      clears the input and shows a `role=alert` validation message that NAMES the file
      ("<basename> could not be attached …"), as real validators do. A real non-attach that
      must stay a browser_upload error with the message surfaced — and NOT read as a success
      just because the basename appears in the alert text (#4032 bug 3 review).
    * a native `<select>` for voluntary self-identification.

  TO REFRESH when Greenhouse changes its markup: open a live application form, read
  the relevant widget's DOM in devtools, and update the matching block below (keep the
  class names forms.py keys on — `select__control`, `select__single-value`,
  `select__menu`, `iti__selected-flag`, `iti__country`, `iti__country-name`), then
  bump the "last modeled" date. Run: pytest tests/test_agent_browser_forms_live.py.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Greenhouse — Apply</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 2rem auto; }
  .field { margin: 1rem 0; }
  label { display: block; font-weight: 600; margin-bottom: .25rem; }
  input[type=text], input[type=email], input[type=tel], select, textarea {
    width: 100%; padding: .4rem; box-sizing: border-box; font-size: 1rem;
  }
  .hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  [hidden] { display: none !important; }

  /* react-select-style combobox */
  .select__container { position: relative; }
  .select__control {
    border: 1px solid #ccc; border-radius: 4px; padding: .35rem .5rem; min-height: 2.2rem;
    display: flex; align-items: center; cursor: pointer; background: #fff;
  }
  .select__single-value { color: #111; }
  .select__placeholder { color: #999; }
  .select__input { border: none; outline: none; flex: 1; min-width: 4rem; padding: 0; }
  .select__indicators { display: flex; align-items: center; }
  .select__dropdown-indicator { width: 1rem; height: 1rem; cursor: pointer; }
  .select__menu {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #fff;
    border: 1px solid #ccc; border-top: none; max-height: 14rem; overflow: auto;
  }
  .select__option { padding: .4rem .5rem; cursor: pointer; }
  .select__option--is-focused { background: #deebff; }

  /* intl-tel-input */
  .iti { position: relative; display: block; }
  .iti__flag-container { position: relative; }
  .iti__selected-flag {
    display: inline-flex; gap: .35rem; align-items: center; cursor: pointer;
    padding: .3rem .5rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: .25rem;
  }
  .iti__country-list {
    list-style: none; margin: 0; padding: 0; border: 1px solid #ccc; max-height: 14rem;
    overflow: auto;
  }
  .iti__country { padding: .35rem .5rem; cursor: pointer; display: flex; gap: .5rem; }
  .iti__hide { display: none; }

  /* file-attach widget: the filename chip the widget renders after a re-render */
  .file-chip {
    display: inline-flex; gap: .4rem; align-items: center; margin-top: .4rem;
    padding: .2rem .5rem; border: 1px solid #ccc; border-radius: 1rem; background: #f4f6f8;
  }
  .file-chip__remove { border: none; background: none; cursor: pointer; font-size: 1rem; line-height: 1; }
  .field-error { color: #b00020; margin-top: .4rem; font-size: .9rem; }
</style>
</head>
<body>
<h1>Apply for this job</h1>
<form id="application" aria-label="Application">

  <div class="field">
    <label for="first_name">First Name *</label>
    <input type="text" id="first_name" name="first_name" required>
  </div>

  <div class="field">
    <label for="last_name">Last Name *</label>
    <input type="text" id="last_name" name="last_name" required>
  </div>

  <div class="field">
    <label for="email">Email *</label>
    <input type="email" id="email" name="email" required>
  </div>

  <!-- Phone — intl-tel-input: select the country, then type the national number. -->
  <div class="field">
    <label for="phone">Phone number *</label>
    <div class="iti" id="phone_iti">
      <div class="iti__flag-container">
        <div class="iti__selected-flag" role="button" tabindex="-1" title="">
          <span class="iti__selected-dial-code"></span>
          <span class="iti__arrow"></span>
        </div>
        <ul class="iti__country-list iti__hide" aria-label="Country"></ul>
      </div>
      <input type="tel" id="phone" name="phone" autocomplete="off">
    </div>
  </div>

  <!-- Work-authorization combobox (react-select, standard open). "Yes, Ireland…" is the
       highlighted first option, so a type+Enter would pick it — the #4032 bug. -->
  <div class="field">
    <label for="visa_input">Are you authorized to work? *</label>
    <div class="select__container" data-options="visa">
      <div class="select__control" id="visa_control">
        <span class="select__single-value"></span>
        <span class="select__placeholder">Select…</span>
        <input id="visa_input" name="visa" class="select__input" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="visa_menu"
               autocomplete="off">
        <span class="select__indicators"><span class="select__dropdown-indicator"></span></span>
      </div>
    </div>
  </div>

  <!-- Country combobox (react-select, standard open); "Afghanistan" first, "United States" present. -->
  <div class="field">
    <label for="country_input">Country *</label>
    <div class="select__container" data-options="country">
      <div class="select__control" id="country_control">
        <span class="select__single-value"></span>
        <span class="select__placeholder">Select…</span>
        <input id="country_input" name="country" class="select__input" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="country_menu"
               autocomplete="off">
        <span class="select__indicators"><span class="select__dropdown-indicator"></span></span>
      </div>
    </div>
  </div>

  <!-- Sponsorship combobox: IGNORES an untrusted mousedown; opens only on ArrowDown or a
       trusted click. Exercises the escalation past strategy (a). -->
  <div class="field">
    <label for="sponsorship_input">Will you now or in the future require immigration sponsorship? *</label>
    <div class="select__container" data-options="sponsorship" data-open="arrowdown-or-trusted">
      <div class="select__control" id="sponsorship_control">
        <span class="select__single-value"></span>
        <span class="select__placeholder">Select…</span>
        <input id="sponsorship_input" name="sponsorship" class="select__input" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="sponsorship_menu"
               autocomplete="off">
        <span class="select__indicators"><span class="select__dropdown-indicator"></span></span>
      </div>
    </div>
  </div>

  <!-- Primary-skill combobox: a TYPE-TO-SEARCH combobox whose listbox renders ONLY after input.
       A mousedown and ArrowDown never open it, so browser_select must type the filter to open
       it — the pre-#4032 open path a pointer-only escalation would have regressed. -->
  <div class="field">
    <label for="skills_input">Primary skill</label>
    <div class="select__container" data-options="skills" data-open="type-to-search" data-filter="text">
      <div class="select__control" id="skills_control">
        <span class="select__single-value"></span>
        <span class="select__placeholder">Start typing…</span>
        <input id="skills_input" name="skills" class="select__input" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="skills_menu"
               autocomplete="off">
        <span class="select__indicators"><span class="select__dropdown-indicator"></span></span>
      </div>
    </div>
  </div>

  <!-- Referral combobox: FILTERS options by a hidden value, not the visible label, so typing
       the wanted option's text hides every option — the unfiltered rescan must find it. -->
  <div class="field">
    <label for="referral_input">How did you hear about us?</label>
    <div class="select__container" data-options="referral" data-filter="value">
      <div class="select__control" id="referral_control">
        <span class="select__single-value"></span>
        <span class="select__placeholder">Select…</span>
        <input id="referral_input" name="referral" class="select__input" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="referral_menu"
               autocomplete="off">
        <span class="select__indicators"><span class="select__dropdown-indicator"></span></span>
      </div>
    </div>
  </div>

  <!-- Security-clearance combobox: ignores untrusted mousedown AND has no ArrowDown handler;
       opens ONLY on a real (trusted) CLI click — the browser_select trusted-click fallback. -->
  <div class="field">
    <label for="clearance_input">Do you require security clearance?</label>
    <div class="select__container" data-options="clearance" data-open="trusted-only">
      <div class="select__control" id="clearance_control">
        <span class="select__single-value"></span>
        <span class="select__placeholder">Select…</span>
        <input id="clearance_input" name="clearance" class="select__input" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="clearance_menu"
               autocomplete="off">
        <span class="select__indicators"><span class="select__dropdown-indicator"></span></span>
      </div>
    </div>
  </div>

  <!-- Preferred-office combobox: a broken/disabled widget that NEVER opens on anything —
       the explicit "could not open the dropdown" error, not "no options were found". -->
  <div class="field">
    <label for="office_input">Preferred office</label>
    <div class="select__container" data-options="office" data-open="never">
      <div class="select__control" id="office_control">
        <span class="select__single-value"></span>
        <span class="select__placeholder">Select…</span>
        <input id="office_input" name="office" class="select__input" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="office_menu"
               autocomplete="off">
        <span class="select__indicators"><span class="select__dropdown-indicator"></span></span>
      </div>
    </div>
  </div>

  <!-- Résumé: a hidden file input behind "Attach" (the input is aria-labelledby the button, so
       it shares the label "Attach" with the cover-letter field — address it by #resume). On
       change the widget REPLACES the input and renders a filename chip, so a nonce on the old
       input is stranded (#4032 bug 3). Also an "Enter manually" trigger whose textarea reveals
       only on a JS-dispatched click. -->
  <div class="field attach-field" id="resume_block">
    <label for="resume">Resume/CV *</label>
    <input type="file" id="resume" name="resume" class="hidden-file attach-input"
           aria-labelledby="attach_resume" accept=".pdf,.doc,.docx,.txt">
    <button type="button" class="attach-btn" id="attach_resume">Attach</button>
    <div class="manual-trigger" id="enter_manually" role="button">Enter manually</div>
    <textarea id="manual_resume" name="manual_resume" rows="6" hidden></textarea>
  </div>

  <!-- Cover letter: a SECOND "Attach" file field (shares the label "Attach" with the résumé).
       Addressing #cover_letter must land here, not on the résumé. Same re-render-on-change. -->
  <div class="field attach-field" id="cover_letter_block">
    <label for="cover_letter">Cover letter</label>
    <input type="file" id="cover_letter" name="cover_letter" class="hidden-file attach-input"
           aria-labelledby="attach_cover_letter" accept=".pdf,.doc,.docx,.txt">
    <button type="button" class="attach-btn" id="attach_cover_letter">Attach</button>
  </div>

  <!-- Transcript: a widget that REJECTS the attach — on change it clears the input and shows a
       validation message. A real non-attach that must stay a browser_upload error. -->
  <div class="field attach-field" id="transcript_block">
    <label for="transcript">Transcript</label>
    <input type="file" id="transcript" name="transcript" class="hidden-file attach-input reject-upload"
           accept=".pdf">
    <button type="button" class="attach-btn" id="attach_transcript">Attach</button>
  </div>

  <!-- Voluntary self-identification — native select. -->
  <div class="field">
    <label for="gender">Gender</label>
    <select id="gender" name="gender">
      <option value="">Please select</option>
      <option>Male</option>
      <option>Female</option>
      <option>Non-binary</option>
      <option>Decline to self identify</option>
    </select>
  </div>

</form>

<script>
"use strict";

// ── react-select-style comboboxes ────────────────────────────────────────────
// Options per container. An entry is either a plain string (visible text === value) or a
// {text, value} pair (value drives data-filter="value" filtering, text is what commits).
// The visa list puts the long "Ireland" option FIRST so it is the highlighted row a
// type+Enter would wrongly commit (the #4032 trap); browser_select clicks the exact match.
// The menu is PORTALLED to <body> (named by aria-controls) and exists ONLY while open — the
// real react-select contract — so a stale selector or an unscoped option scan can't see it.
var OPTIONS = {
  visa: ["Yes, Ireland Highly Skilled Worker Visa", "Yes", "No"],
  country: ["Afghanistan", "Åland Islands", "Albania", "Canada", "Ireland",
            "United Kingdom", "United States", "Zimbabwe"],
  sponsorship: ["Yes", "No", "Not sure"],
  skills: ["Python", "JavaScript", "Go", "Rust"],   // type-to-search: listbox renders only on input
  referral: [{ text: "LinkedIn", value: "li" }, { text: "Referral", value: "ref" },
             { text: "Company website", value: "web" }, { text: "Job board", value: "jb" }],
  clearance: ["Yes", "No"],
  office: ["Remote", "London", "San Francisco"]   // never rendered — this control never opens
};

document.querySelectorAll(".select__container").forEach(function (container) {
  var which = container.getAttribute("data-options");
  var mode = container.getAttribute("data-open") || "standard";
  var filterMode = container.getAttribute("data-filter") || "none";
  var control = container.querySelector(".select__control");
  var input = container.querySelector("input[role=combobox]");
  var single = container.querySelector(".select__single-value");
  var placeholder = container.querySelector(".select__placeholder");
  var menuId = input.getAttribute("aria-controls");
  var isFocused = false;
  var openAfterFocus = false;           // react-select: a mousedown-driven focus opens the menu

  function menuEl() { return document.getElementById(menuId); }
  function isOpen() { return !!menuEl(); }

  function renderOptions(menu) {
    var list = menu.querySelector(".select__menu-list");
    while (list.firstChild) list.removeChild(list.firstChild);
    var q = (input.value || "").trim().toLowerCase();
    OPTIONS[which].forEach(function (entry) {
      var text = (typeof entry === "string") ? entry : entry.text;
      var value = (typeof entry === "string") ? text : (entry.value || entry.text);
      if (q) {
        if (filterMode === "value" && value.toLowerCase().indexOf(q) < 0) return;  // hidden by filter
        if (filterMode === "text" && text.toLowerCase().indexOf(q) < 0) return;
      }
      var opt = document.createElement("div");
      opt.className = "select__option" + (list.children.length === 0 ? " select__option--is-focused" : "");
      opt.setAttribute("role", "option");
      opt.textContent = text;
      // Commit on mousedown — what react-select does, and the event forms.py fires first.
      opt.addEventListener("mousedown", function (e) { e.preventDefault(); commit(text); });
      list.appendChild(opt);
    });
  }

  function openMenu() {
    if (isOpen()) return;
    var menu = document.createElement("div");
    menu.className = "select__menu";
    menu.id = menuId;                     // named by aria-controls, ONLY while open
    var list = document.createElement("div");
    list.className = "select__menu-list";
    list.setAttribute("role", "listbox");
    menu.appendChild(list);
    document.body.appendChild(menu);      // PORTALLED to <body>, like real react-select
    renderOptions(menu);
    input.setAttribute("aria-expanded", "true");
  }

  function closeMenu() {
    var m = menuEl();
    if (m) m.remove();
    input.setAttribute("aria-expanded", "false");
  }

  function commit(text) {
    single.textContent = text;            // the committed value forms.py reads back
    if (placeholder) placeholder.style.display = "none";
    input.value = "";                     // react-select clears the search on commit
    input.dispatchEvent(new Event("input", { bubbles: true }));
    closeMenu();
  }

  if (mode === "never") return;           // a broken/disabled widget — no open handlers at all

  input.addEventListener("focus", function () {
    isFocused = true;
    if (openAfterFocus) { openAfterFocus = false; openMenu(); }
  });
  input.addEventListener("blur", function () {
    isFocused = false;
    openAfterFocus = false;
    closeMenu();                          // react-select closes the menu when focus leaves
  });
  input.addEventListener("input", function () {
    if (mode === "type-to-search") {
      // the listbox renders ONLY after input: open on a non-empty query, collapse when cleared
      if ((input.value || "").trim()) { openMenu(); renderOptions(menuEl()); }
      else closeMenu();
      return;
    }
    var m = menuEl();
    if (m) renderOptions(m);              // re-filter the open menu as the search text changes
  });

  control.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;           // primary button only (real react-select)
    if (mode === "arrowdown-or-trusted" || mode === "trusted-only") {
      if (!e.isTrusted) return;           // ignores a synthetic mousedown
    }
    e.preventDefault();                   // keep focus on the input
    if (mode === "type-to-search") { input.focus(); return; }  // focus only — no menu until typing
    if (!isFocused) {
      openAfterFocus = true;
      input.focus();                      // the focus handler opens via openAfterFocus
    } else if (isOpen()) {
      closeMenu();                        // a second mousedown while open TOGGLES closed
    } else {
      openMenu();
    }
  });

  if (mode !== "trusted-only") {
    input.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (mode === "type-to-search") return;  // no ArrowDown open — the listbox needs input
        if (!isOpen()) openMenu();        // ArrowDown opens (an OPEN signal, not a commit)
      } else if (e.key === "Enter") {
        e.preventDefault();               // Enter commits the highlighted row — the #4032 trap
        var m = menuEl();
        var focused = m && m.querySelector(".select__option--is-focused");
        if (focused) commit(focused.textContent);
      }
    });
  }
});

// ── intl-tel-input ────────────────────────────────────────────────────────────
// Afghanistan and Åland Islands first (the real plugin's default ordering), United
// States present. Picking a country writes "<name>: +<dial>" into the selected flag's
// title — which is what forms.py reads back.
var ITI_COUNTRIES = [
  ["Afghanistan", "93"], ["Åland Islands", "358"], ["Albania", "355"],
  ["Canada", "1"], ["Ireland", "353"], ["United Kingdom", "44"],
  ["United States", "1"], ["Zimbabwe", "263"]
];

document.querySelectorAll(".iti").forEach(function (iti) {
  var flag = iti.querySelector(".iti__selected-flag");
  var dial = iti.querySelector(".iti__selected-dial-code");
  var list = iti.querySelector(".iti__country-list");

  ITI_COUNTRIES.forEach(function (c) {
    var li = document.createElement("li");
    li.className = "iti__country";
    li.setAttribute("data-dial-code", c[1]);
    var name = document.createElement("span");
    name.className = "iti__country-name";
    name.textContent = c[0];
    var code = document.createElement("span");
    code.className = "iti__dial-code";
    code.textContent = "+" + c[1];
    li.appendChild(name);
    li.appendChild(code);
    li.addEventListener("click", function () {
      flag.setAttribute("title", c[0] + ": +" + c[1]);   // committed country (read back)
      if (dial) dial.textContent = "+" + c[1];
      list.classList.add("iti__hide");
    });
    list.appendChild(li);
  });

  flag.addEventListener("click", function () { list.classList.toggle("iti__hide"); });
});

// ── file-attach widgets (résumé, cover letter, transcript) ──────────────────────
// Live Greenhouse/Ashby REPLACE the <input type=file> on change with a fresh one (same
// id/name, empty files) and show the attached filename as a removable chip — which strands
// any nonce tagged on the OLD input, so browser_upload must verify via the fresh input's
// id/name or the chip (#4032 bug 3). A `.reject-upload` input instead models a client-side
// validator that REJECTS the file (clears it and shows a message) — a real non-attach.
function renderChip(block, name) {
  var old = block.querySelector(".file-chip");
  if (old) old.remove();
  var chip = document.createElement("span");
  chip.className = "file-chip";
  var nm = document.createElement("span");
  nm.className = "file-chip__name";
  nm.textContent = name;                 // the attached filename, visible after the re-render
  var rm = document.createElement("button");
  rm.type = "button";
  rm.className = "file-chip__remove";
  rm.textContent = "×";             // ×, a <button> — stripped by abTextNoControls
  chip.appendChild(nm);
  chip.appendChild(rm);
  block.appendChild(chip);
}

function wireAttach(input) {
  input.addEventListener("change", function () {
    var block = input.closest(".attach-field");
    var name = (input.files && input.files.length) ? input.files[0].name : "";
    if (input.classList.contains("reject-upload")) {
      input.value = "";                  // a validator that won't accept the file — clear it
      var err = block.querySelector(".field-error");
      if (!err) {
        err = document.createElement("div");
        err.className = "field-error";
        err.setAttribute("role", "alert");
        block.appendChild(err);
      }
      // NAME the rejected file in the message (live validators do: "resume.pdf exceeds 5MB"). The
      // basename is now in the container's text, so a substring check would FALSELY read this
      // non-attach as a success — browser_upload must treat an alert as an alert, never a chip.
      err.textContent = (name || "The file") + " could not be attached — it must be a PDF under 5MB";
      return;
    }
    if (!name) return;
    // re-render: swap in a fresh, EMPTY input (same identity, no nonce) and show the chip
    var fresh = input.cloneNode(false);
    fresh.value = "";
    fresh.removeAttribute("data-pa-upload");
    input.parentNode.replaceChild(fresh, input);
    wireAttach(fresh);
    renderChip(block, name);
  });
}

document.querySelectorAll("input[type=file].attach-input").forEach(wireAttach);

// The "Attach" buttons proxy a click to their (current) hidden file input (Greenhouse pattern).
// browser_upload sets the input's files directly, so this is only cosmetic.
document.querySelectorAll(".attach-btn").forEach(function (btn) {
  var block = btn.closest(".attach-field");
  btn.addEventListener("click", function () {
    var inp = block.querySelector("input[type=file]");
    if (inp) inp.click();
  });
});

// "Enter manually": a native (trusted) click reports success but does NOTHING — only a
// JS-dispatched (untrusted) click reveals the textarea, which is the exact Greenhouse
// behavior browser_click(js_fallback=True) was built for. The trigger is a non-focusable
// element, so a CLI click leaves document.activeElement unchanged and the js-fallback
// fingerprint can tell nothing happened.
document.getElementById("enter_manually").addEventListener("click", function (e) {
  if (e.isTrusted) return;                 // a native/CLI click does nothing
  document.getElementById("manual_resume").hidden = false;
});
</script>
</body>
</html>
