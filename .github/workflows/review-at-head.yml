name: Review at head

# The QA panel (`protoreview[bot]`) is NOT one of the required checks on `main`, and when it
# does not review a head it posts NOTHING — so an unreviewed merge looks exactly like a
# reviewed one: no status, nothing red, `mergeStateStatus` still CLEAN. #3298 merged at a head
# the panel had never seen; #3301 put 65 files on `main` with no verdict at all.
#
# This job posts a `Review at head` commit status on every open PR answering one question:
# is there a panel verdict for THIS head SHA? It does not re-judge code — verdict quality is
# the panel's own `QA panel` status, and a WARN passes here (ADR 0078 keeps that tier
# advisory; #3297 shipped one). Logic lives in scripts/review_at_head.py, covered by
# tests/test_review_at_head.py; this job only wires the token in.
#
# Make it required on the `main` ruleset to close the hole for real — the status is posted on
# every open PR, including ones the panel never touches, so it cannot silently go missing the
# way the thing it guards does. `skip-review-gate` is the documented escape hatch.
#
# `pull_request_target` (not `pull_request`) for the same reason as team-ready-claims.yml:
# posting a commit status needs a write token, which `pull_request` withholds from fork PRs.
# Safe here for the usual reason — the job checks out and runs the BASE repo's script, reads
# only the GitHub API, and never executes any PR-authored code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    # Fast path, best-effort: fires only for PRs whose branch contains this file (see the
    # schedule comment). Kept because when it does fire it turns a PR green in seconds.
    types: [submitted, dismissed]
  check_run:
    # The panel opening or concluding a run on a head (#4260). A head with no verdict but a
    # panel run in flight posts `pending`, so this is what moves it on in seconds: `created`
    # catches a push whose own run beat the panel to the head (it would have posted failure),
    # `completed` re-reads once the round ends. Runs from the DEFAULT branch with this file's
    # write token, so unlike `pull_request_review` it fires for every PR, forks included. Any
    # other check run is skipped by the job's `if:` before a runner is spent on it.
    types: [created, completed]
  schedule:
    # Every 10 minutes, and this is the PRIMARY refresh, not a backstop. `pull_request_review`
    # runs the workflow from the PR's OWN BRANCH (unlike `pull_request_target`, which always
    # uses the base) — so a PR branched before this file existed never fires that event, and a
    # fork PR that does fire it gets a read-only token that cannot post a status. Observed
    # live: reviews landing on #3323 and #3319 at 00:17 and 00:18 triggered no run at all,
    # and only the sweep turned them green. Now that this check is REQUIRED, the sweep interval
    # is the worst-case time a reviewed PR sits red — an hour of that is not acceptable.
    #
    # NOTE: this asks for 10 minutes and does not get it. GitHub throttles high-frequency
    # schedules, and a newly added one takes a while to register at all (this fired nothing for
    # ~30 minutes after it merged). Observed cadence here is ~30 min: 01:10, 01:40, 02:09, 02:47.
    # Asking for 10 still yields a shorter interval than asking for 30, so it stays — but the
    # honest guarantee is "roughly half-hourly", and `gh workflow run "Review at head"` is the
    # way to refresh now. Do not tighten this expecting it to help.
    - cron: "*/10 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the decision without posting statuses"
        type: boolean
        default: false

permissions:
  statuses: write
  checks: read # the panel's check runs on a head: in flight → pending (#4260)
  pull-requests: read
  contents: read

concurrency:
  # Per PR, so a rapid push/review pair cannot post two statuses out of order for one head.
  # Never cancel-in-progress: a cancelled run leaves the status it was about to write missing,
  # which is the exact silence this gate exists to remove.
  group: review-at-head-${{ github.event.pull_request.number || github.event.check_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  assert:
    # NOT named "Review at head": that is the COMMIT STATUS this job posts, and a check-run
    # sharing the name puts three same-named rows on every PR — two green (the job ran fine)
    # and one red (the verdict is missing). The rollup does resolve to failure, but the
    # required-check context would then be ambiguous between a check-run that only says "the
    # job executed" and the status that carries the actual answer. One name, one meaning.
    name: Assert a panel verdict at head
    # check_run fires for EVERY check run in the repo; only the reviewer app's two matter.
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.app.slug == 'protoreview' &&
       contains(fromJSON('["QA panel","protoReview"]'), github.event.check_run.name))
    runs-on: ubuntu-latest # workspace-config: allow-hosted-runner public repo — GH-hosted is free
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Assert a verdict exists for this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # check_run mode: sweep only the open PRs whose head is this run's head.
          CHECK_RUN_HEAD_SHA: ${{ github.event.check_run.head_sha }}
          # A run in flight this long with no verdict is stalled → failure, not pending.
          PANEL_STALL_MINUTES: ${{ vars.PANEL_STALL_MINUTES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Rollout gate for the coverage / standing-block contract (#3334). Left EMPTY (off)
          # until the QA-panel emitter + approve-on-green promoter — both outside this repo —
          # ship the authoritative `coverage`/`standing_block` attributes; enforcing fail-closed
          # on their absence against today's legacy markers would red every open PR. When present,
          # an explicit attribute is honoured regardless of this flag; the flag only decides how a
          # MISSING attribute is read. Flip it by setting the `REQUIRE_COVERAGE_CONTRACT` repo
          # variable to a truthy value ("1"/"true") once the producer rollout is live — no code change.
          REQUIRE_COVERAGE_CONTRACT: ${{ vars.REQUIRE_COVERAGE_CONTRACT }}
        run: python3 scripts/review_at_head.py
