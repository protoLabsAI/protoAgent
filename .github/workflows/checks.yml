name: Checks

# PR + main gate: enforce the fleet workspace-config standard and run the
# Python test suite. Replaces the prior collect-only smoke in docker-publish.yml
# with a real `pytest` run, and catches .beads/.automaker/runner drift in CI
# instead of as a mid-run failure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Cost control: a new push to a PR supersedes the old one, so cancel the in-flight run
# instead of letting both finish (the Windows leg bills 2× and runs ~14 min — five rapid
# pushes were five full matrices). Keyed per PR; `main` pushes get a unique per-commit group
# and are never cancelled, so every landed commit is still fully tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace-config:
    name: Verify workspace config
    runs-on: ubuntu-latest  # workspace-config: allow-hosted-runner public repo — GH-hosted is free
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Verify workspace config (.beads / .automaker / owned runners)
        # Fork-friendly (#1534): the .beads/.automaker/owned-runner baseline is the
        # protoLabs *fleet* standard, so it runs across the fleet (protoLabsAI/*) —
        # keeping gina/protoTrader/roxy conformant — but is skipped on external forks,
        # which are free to diverge. The job stays green either way (the server.py
        # guard below still runs everywhere).
        if: startsWith(github.repository, 'protoLabsAI/')
        # The npm package is still 1.0.0 (predates verify-workspace-config),
        # so run the script directly. It's zero-dependency (node builtins
        # only), so no `npm install` is needed. Switch to
        # `npx -p @protolabsai/release-tools verify-workspace-config` once
        # 1.1.0+ is published to npm (protoLabsAI/release-tools#27).
        # Pinned by commit SHA (same supply-chain posture as the
        # release-tools action pin in release.yml) so a push to that repo's
        # main can't change what executes in this PR gate. To bump: pick the
        # new release-tools SHA/tag and update both the SHA and the version
        # comment below.
        run: |
          git clone https://github.com/protoLabsAI/release-tools /tmp/release-tools
          git -C /tmp/release-tools checkout 96159f8f3adf3cce60278cc689b67521ff5a547c # v2.3.0
          node /tmp/release-tools/bin/verify-workspace-config.mjs --root "$GITHUB_WORKSPACE"
      - name: Guard against the deleted server.py entrypoint
        # ADR 0023 promoted the monolith to the server/ package (launch:
        # `python -m server`). A launcher pointing at the old single-file binary
        # CrashLoopBackOffs (deploy) or silently no-ops (infra/autostart.py's exists()
        # check — missed by the original *.sh/*.yml-only net, fixed alongside this
        # guard's *.py extension). Two patterns: shell-style `python server.py`
        # launches, and Python-side quoted "server.py" path constructions
        # (e.g. `REPO_ROOT / "server.py"`). Excludes .github (self-match) and
        # tests/ (regression tests assert on the literal string).
        run: |
          if grep -rnE '(python[0-9]* +server\.py|"server\.py")' \
               --include='*.sh' --include='*.yaml' --include='*.yml' \
               --include='Dockerfile*' --include='*.py' \
               --exclude-dir=.github --exclude-dir=tests \
               --exclude-dir=node_modules --exclude-dir=.venv . ; then
            echo "::error::Stale single-file launch found — use 'python -m server' (ADR 0023)."
            exit 1
          fi
          echo "ok: no stale single-file launches in deploy artifacts or launchers"

  # The CHANGELOG gate lives in its own workflow (.github/workflows/changelog.yml)
  # so that applying the `skip-changelog` label re-triggers it — it needs
  # `types: [… labeled, unlabeled]`, and putting those here would re-run the whole
  # Python suite, fleet integration and web E2E on every label change.

  lint:
    name: Lint (ruff + import contracts)
    runs-on: ubuntu-latest  # workspace-config: allow-hosted-runner public repo — GH-hosted is free
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned lint tools
        # Pinned so a new ruff/import-linter release can't add a rule that fails
        # the gate out from under a PR. Ruff config + ignores live in
        # pyproject.toml; the import contracts (graph/ and the infra packages
        # must not import server/ or operator_api/) + the grandfathered burndown
        # list live in pyproject.toml [tool.importlinter].
        run: pip install ruff==0.15.10 import-linter==2.11
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned like ruff/import-linter above, and for a sharper reason: uv's lock
          # OUTPUT is version-dependent. 0.11.29 and 0.11.13 disagree about how to record
          # dependency markers (0.11.29 drops `python_full_version < '3.13'` from aiologic
          # /culsans), so an unpinned `latest` rewrites uv.lock whenever uv ships — the
          # file then thrashes based on whose uv ran last, and the lockfile check inside
          # the gate is the thing that notices. 0.11.29 produced the lock currently on main.
          # To bump: change BOTH here and in prepare-release.yml (they must match), then
          # run `uv lock` once and commit the result.
          version: "0.11.29"
      - name: Fast gate (lint only)
        # scripts/gate.py is the ONE repo-owned fast gate — the same command
        # contributors run locally (PROTO.md "Must pass before opening a PR"),
        # so the local and CI lint gates can't drift. --lint-only runs, fail-fast:
        #   ruff check .                              (lint)
        #   lint-imports                              (import-layering contracts)
        #   python scripts/gen_attribution.py --check (attribution manifest in
        #     sync with uv.lock + package-lock.json; fix: `uv sync && uv run
        #     python scripts/gen_attribution.py`)
        #   uv lock --check                           (lockfile in sync with
        #     pyproject — the #1998 rot guard; fix: `uv lock`)
        run: python scripts/gate.py --lint-only

  tests:
    name: Python tests
    runs-on: ubuntu-latest  # workspace-config: allow-hosted-runner public repo — GH-hosted is free
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # venv keeps tests/conftest.py's site.getsitepackages() reorder
        # resolving correctly (see #175).
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run tests
        # Kept as a bare pytest call (not `python scripts/gate.py`) so lint and
        # tests stay separate jobs with parallel execution and clear failure
        # attribution — the no-flag gate script runs this same suite locally.
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q

  windows-tests:
    name: Windows tests (native)
    # Phase-3 gate from #2412: protoAgent ships a Windows desktop release, but
    # until this job the only native PR feedback was a contributor's own
    # machine. Runs the suite minus the tracked POSIX-only backlog (below);
    # anything not excluded failing on Windows gates the PR.
    #
    # Cost: the Windows runner bills 2× and takes ~14 min, so skip it while a PR is a
    # DRAFT (work-in-progress) — it runs the moment the PR is marked ready for review, and
    # always on push-to-main. Combined with the workflow `concurrency` above, a WIP branch
    # no longer spends a Windows matrix on every intermediate push.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest  # workspace-config: allow-hosted-runner public repo — GH-hosted is free
    timeout-minutes: 35
    env:
      # PEP 686 direction, and half the historic Windows-only failures were
      # cp1252 UnicodeEncodeErrors in test output rather than real defects.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # Mirrors the Ubuntu tests job (venv per #175); git-bash keeps the
        # steps byte-comparable with the POSIX legs.
        shell: bash
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run tests (suite minus the tracked POSIX-only backlog)
        # tests/windows_native_exclusions.txt is the #2412 burndown: files that
        # failed natively at the 2026-08-08 baseline. Everything else (~4650
        # tests) must pass on Windows or this job fails the PR.
        shell: bash
        run: |
          source .venv/Scripts/activate
          IGNORES=$(grep -vE '^\s*(#|$)' tests/windows_native_exclusions.txt | sed 's|^|--ignore=|' || true)
          python -m pytest tests/ -q $IGNORES

  fleet-integration:
    name: Fleet integration (multi-instance)
    runs-on: ubuntu-latest  # workspace-config: allow-hosted-runner public repo — GH-hosted is free
    # These tests boot real `python -m server` hub+member processes (against the
    # local scripts/fake_openai_server.py) on free loopback ports + tmp roots, so
    # they're much slower than the unit suite — allow ~10 min. Kept a SEPARATE job
    # from `tests` so its real-boot slowness never gates the fast unit run.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # Mirror the `tests` job: full requirements.txt in a venv so
        # tests/conftest.py's site.getsitepackages() reorder resolves (#175).
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Boot real multi-instance fleet (hub + members) and exercise it
        # PA_RUN_INTEGRATION=1 flips on the real-subprocess harness the default
        # `pytest tests/` skips. Covers instance isolation, hub→member proxy
        # round-trip, cross-instance A2A delegation, and member crash→detect→restart
        # (POSIX zombie-reap — works on Linux). No network egress beyond loopback:
        # the fake gateway is local; mDNS advertise binds loopback only.
        run: |
          . .venv/bin/activate
          PA_RUN_INTEGRATION=1 python -m pytest tests/integration -q

  live-smoke:
    name: A2A live smoke (lean tier)
    runs-on: ubuntu-latest  # workspace-config: allow-hosted-runner public repo — GH-hosted is free
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lean (core) deps
        # requirements-core.txt is the PRODUCTION image's dependency set (the
        # `--ui none` tier). Installing it here — not the full requirements.txt —
        # also guards the lean-image import gap class (e.g. the FastAPI-missing
        # bug that only push-to-main caught, #426).
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Boot the real server vs a fake model + drive a real A2A turn
        # Catches the green-but-wire-broken class unit/mock tests miss — CRLF SSE
        # framing, A2A routing + version negotiation, agent-card build, lean boot.
        run: |
          . .venv/bin/activate
          python scripts/live_smoke.py

  web-e2e:
    name: Web E2E smoke
    runs-on: ubuntu-latest  # workspace-config: allow-hosted-runner public repo — GH-hosted is free
    # Browsers + system deps come PREINSTALLED in the Playwright job container —
    # ZERO apt at runtime. This retires the apt lock-contention flake class that
    # failed five runs across 2026-08-18/19 and outlived two rounds of runner
    # hardening (#2845/#2849): background apt could hold the dpkg locks (or just
    # fetch slowly) longer than any polite wait. The tag is pinned to the LOCKED
    # @playwright/test version — a guard step below fails loudly on drift.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      # The lockfile is npm-11-shaped (PROTO.md: npm-10 arborist no-ops workspace
      # dep bumps and disagrees with 11 about peer-stub reachability, so its `ci`
      # rejects an 11-generated lock). Pin every root `npm ci`/`install` to 11.
      - name: Use npm 11
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests (vitest)
        # Pure-logic unit tests (chat-store reducers, the A2A SSE frame parser,
        # the uiStore persist migration). Fast — runs before the heavier
        # Playwright path so a reducer regression fails the job early.
        run: npm run test:unit --workspace @protoagent/web
      - name: Playwright version must match the container image
        # The pinned container ships the browsers for exactly one Playwright
        # version. When package-lock bumps @playwright/test, bump the job's
        # `container.image` tag in lockstep — this guard turns silent drift
        # (subtle browser-mismatch failures) into a one-line fix instruction.
        run: |
          want="1.61.1"
          have=$(node -p "require('@playwright/test/package.json').version")
          if [ "$have" != "$want" ]; then
            echo "::error::@playwright/test is $have but the web-e2e container is pinned to v$want — update the container image tag in checks.yml (job web-e2e) to mcr.microsoft.com/playwright:v$have-noble"
            exit 1
          fi
      - name: Run E2E smoke (built SPA vs mock backend)
        # Builds the web app, then drives it with Playwright against the
        # deterministic mock backend (apps/web/e2e/mock-server.mjs) — no Python,
        # model, or network. Guards the operator-console rendering contract:
        # tool-call cards, markdown, slash commands, runtime panel.
        run: npm run test:e2e --workspace @protoagent/web
