name: Secret scan

# Block any secret from reaching the repo's files (postmortem 2026-06-09: a gateway API
# key reached main via #749, swept in by `git add -A` of a per-instance config dir).
# Scans the working TREE (`--no-git`) so it catches secrets in committed files without
# failing on the historical leak still in git history (that risk is handled by rotation).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (tree)
    runs-on: ubuntu-latest  # workspace-config: allow-hosted-runner public repo — GH-hosted is free
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks
        run: |
          # Download to a file with retries, then check the pinned sha256 before unpacking.
          # Piping curl straight into tar turned a GitHub release-CDN 504 into a "not in gzip
          # format" failure on every PR (2026-11-08).
          VER=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 15 --max-time 120 \
            -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan tracked files
        run: gitleaks detect --no-git --redact --no-banner --exit-code 1
