<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org Chart</title>
<style>
  html,body{margin:0;height:100%;background:var(--pl-color-bg,#0b0d10);color:var(--pl-color-fg,#e6e6e6);
    font-family:var(--pl-font-sans,system-ui,sans-serif);font-size:13px}
  .wrap{max-width:1400px;margin:0 auto;padding:var(--pl-space-4,16px) var(--pl-space-6,24px)}
  header{display:flex;align-items:baseline;gap:var(--pl-space-4,16px);margin-bottom:10px}
  header h1{font-size:18px;margin:0;font-weight:600}
  .sub{color:var(--pl-color-fg-muted,#8a8f98);font-size:12px}
  .sub b{color:var(--pl-color-fg,#e6e6e6);font-weight:600}
  .spacer{flex:1}
  .chip{font-size:11px;color:var(--pl-color-fg-muted,#8a8f98)}
  .chip.stale::before{content:"⟳ ";animation:spin 1.2s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  button.refresh{background:none;border:1px solid var(--pl-color-border,#272b33);color:var(--pl-color-fg,#e6e6e6);
    border-radius:var(--pl-radius,6px);padding:3px 10px;font-size:12px;cursor:pointer}
  button.refresh:hover{background:var(--pl-color-bg-subtle,#15181d)}
  button.refresh:disabled{opacity:.5;cursor:default}
  .err{color:var(--pl-color-status-error,#f85149);font-size:12px;margin:8px 0}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--pl-color-fg-muted,#8a8f98);margin:6px 2px 8px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 2px 12px}
  button.chip-btn{font-size:11px;padding:2px 10px;border-radius:999px;cursor:pointer;
    background:none;border:1px solid var(--pl-color-border,#272b33);color:var(--pl-color-fg,#e6e6e6);
    display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  button.chip-btn:hover{background:var(--pl-color-bg-subtle,#15181d)}
  button.chip-btn[aria-pressed="false"]{opacity:.45;border-style:dashed}
  button.chip-btn .n{color:var(--pl-color-fg-muted,#8a8f98);font-variant-numeric:tabular-nums}
  .filters .note{font-size:11px;color:var(--pl-color-fg-muted,#8a8f98)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:5px}
  .legend .dash{display:inline-block;width:18px;border-top:1.6px dashed var(--pl-color-fg-muted,#8a8f98);vertical-align:middle;margin-right:5px}
  .cols{display:flex;gap:12px;align-items:flex-start}
  .gwrap{flex:1;overflow:auto;border:1px solid var(--pl-color-border,#272b33);border-radius:var(--pl-radius,8px);
    background:var(--pl-color-bg-subtle,#15181d);padding:10px;min-height:140px}
  .empty{color:var(--pl-color-fg-muted,#8a8f98);padding:48px 0;text-align:center}
  .empty code{font-family:var(--pl-font-mono,ui-monospace,monospace);color:var(--pl-color-fg,#e6e6e6)}
  svg g.node{cursor:pointer}
  svg g.node.sel rect{stroke-width:2.4}
  text{user-select:none}
  /* detail panel */
  .panel{width:280px;flex:none;border:1px solid var(--pl-color-border,#272b33);border-radius:var(--pl-radius,8px);
    background:var(--pl-color-bg-subtle,#15181d);padding:14px;font-size:12px}
  .panel[hidden]{display:none}
  .panel h2{margin:0 0 2px;font-size:14px;font-weight:600;overflow-wrap:anywhere}
  .panel .role{color:var(--pl-color-fg-muted,#8a8f98);margin-bottom:10px}
  .panel dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
  .panel dt{color:var(--pl-color-fg-muted,#8a8f98)}
  .panel dd{margin:0;overflow-wrap:anywhere}
  .panel a{color:var(--pl-color-accent,#6cb6ff);text-decoration:none}
  .panel a:hover{text-decoration:underline}
  .panel .close{float:right;background:none;border:none;color:var(--pl-color-fg-muted,#8a8f98);cursor:pointer;font-size:14px;padding:0}
  .panel .kindtag{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--pl-color-border,#272b33);border-radius:4px;padding:0 4px;margin-left:6px;
    color:var(--pl-color-fg-muted,#8a8f98);vertical-align:middle}
  .panel dd.mono{font-family:var(--pl-font-mono,ui-monospace,monospace);font-size:11.5px}
</style>
<script>
  var BASE = location.pathname.split("/plugins/")[0];   // slug-aware (fleet proxy)
  (function(){ var l=document.createElement("link"); l.rel="stylesheet";
    l.href=BASE+"/_ds/plugin-kit.css"; document.head.appendChild(l); })();
</script>
</head><body>
<div class="wrap">
  <header>
    <h1>Org Chart</h1><div class="sub" id="summary"></div>
    <div class="spacer"></div>
    <span class="chip" id="freshness"></span>
    <button class="refresh" id="refresh" title="Drop caches and re-crawl the fleet">⟳ Refresh</button>
  </header>
  <div class="legend">
    <span><i style="background:var(--pl-color-accent,#6cb6ff)"></i>this agent</span>
    <span><i style="background:var(--pl-color-status-success,#3fb950)"></i>up</span>
    <span><i style="background:var(--pl-color-status-error,#f85149)"></i>down / unreachable</span>
    <span><i style="background:var(--pl-color-fg-muted,#8a8f98)"></i>not probed yet</span>
    <span>arrow = can delegate to</span>
    <span><span class="dash"></span>supervised fleet member</span>
  </div>
  <div class="filters" id="filters"></div>
  <div id="err" class="err" hidden></div>
  <div class="cols">
    <div id="graph" class="gwrap"></div>
    <aside class="panel" id="panel" hidden>
      <button class="close" id="panel-close" title="Close">✕</button>
      <h2 id="p-name"></h2>
      <div class="role" id="p-role"></div>
      <dl id="p-rows"></dl>
    </aside>
  </div>
</div>
<script type="module">
let kit;
try { kit = await import(BASE + "/_ds/plugin-kit.js"); }
catch (e) {
  // Fail LOUDLY and name the real cause (#2392): the old bearer-less fetch substitute
  // turned "kit missing" into an HTTP 401 that sent operators auditing tokens.
  const err = document.getElementById("err");
  err.hidden = false;
  err.textContent = "The DS plugin kit failed to load — the console bundle (/_ds) is missing or stale " +
    "(a source install without a web build, or a packaging regression). This view cannot authenticate without it.";
  throw e;
}
const api = async (p, init) => {
  const r = await kit.apiFetch(p, init);
  const d = await r.json().catch(() => { throw new Error("HTTP " + r.status + " (non-JSON response)"); });
  if (!r.ok) throw new Error((d && (d.detail || d.error)) || "HTTP " + r.status);
  return d;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = (id) => document.getElementById(id);

let TOPO = null, SELECTED = null, POLL_S = 8, timer = null;

// The three drawable classes besides `self`. `agent` is an a2a peer (crawlable); `coder`
// and `model` are LEAVES — a coding agent's subprocess and a model endpoint — so they
// carry no outbound edges and their status is their owner's probe result, not ours.
const KINDS = [
  { kind: "agent", label: "Agents", badge: "" },
  { kind: "coder", label: "Coders (ACP)", badge: "ACP" },
  { kind: "model", label: "Models", badge: "MODEL" },
];
const HIDE_KEY = "orgchart.hidden";
// Browser storage throws outright in some embeddings (blocked site data), so every
// read and write is guarded and the view renders correctly with no stored value.
const store = {
  get(){ try { return new Set(JSON.parse(localStorage.getItem(HIDE_KEY) || "[]")); } catch { return new Set(); } },
  set(v){ try { localStorage.setItem(HIDE_KEY, JSON.stringify([...v])); } catch { /* not fatal */ } },
};
let HIDDEN = store.get();

const CLR = {
  accent: "var(--pl-color-accent,#6cb6ff)",
  up: "var(--pl-color-status-success,#3fb950)",
  down: "var(--pl-color-status-error,#f85149)",
  muted: "var(--pl-color-fg-muted,#8a8f98)",
  border: "var(--pl-color-border,#272b33)",
};
// Tri-state: `up === null` means nothing has probed it yet, which is not the claim
// "down" — an unprobed coder painted red sends operators hunting a fault that isn't there.
const dotColor = (n) => n.kind === "self" ? CLR.accent : n.up === true ? CLR.up : n.up === false ? CLR.down : CLR.muted;
const statusText = (n) => n.kind === "self" ? "this agent"
  : n.up === true ? "up" : n.up === false ? "down / unreachable" : "not probed yet";

/** The nodes and edges left after the filter chips — self is never filterable. */
function visible(topo){
  const nodes = (topo.nodes || []).filter(n => n.kind === "self" || !HIDDEN.has(n.kind));
  const ids = new Set(nodes.map(n => n.id));
  return { nodes, edges: (topo.edges || []).filter(e => ids.has(e.from) && ids.has(e.to)) };
}

// ── layered SVG graph (BFS distance from self → cycle-safe) ─────────────────────────
function draw(topo){
  const { nodes, edges } = visible(topo), self = topo.self;
  if (nodes.length <= 1) return `<div class="empty">${
    (topo.nodes || []).length > 1
      ? "Every node is hidden by the filters above."
      : "No delegates or fleet members found.<br>Add a delegate (Settings → Delegates) and it'll appear here."
  }</div>`;
  const byId = new Map(nodes.map(n => [n.id, n]));
  const layer = new Map(); if (byId.has(self)) layer.set(self, 0);
  let frontier = byId.has(self) ? [self] : [];
  while (frontier.length){
    const next = [];
    for (const u of frontier) for (const e of edges)
      if (e.from === u && byId.has(e.to) && !layer.has(e.to)){ layer.set(e.to, layer.get(u)+1); next.push(e.to); }
    frontier = next;
  }
  let maxL = 0; layer.forEach(v => { if (v > maxL) maxL = v; });
  nodes.forEach(n => { if (!layer.has(n.id)) layer.set(n.id, maxL+1); });
  maxL = 0; layer.forEach(v => { if (v > maxL) maxL = v; });
  const cols = {};
  nodes.forEach(n => { const L = layer.get(n.id); (cols[L] = cols[L] || []).push(n); });
  const NW=190, NH=48, COLW=258, RH=70, PX=18, PY=18;
  let maxRows = 0;
  Object.keys(cols).forEach(L => {
    maxRows = Math.max(maxRows, cols[L].length);
    cols[L].forEach((n,i) => { n._x = PX + Number(L)*COLW; n._y = PY + i*RH; });
  });
  const pos = new Map(nodes.map(n => [n.id, n]));
  const W = PX*2 + maxL*COLW + NW, H = Math.max(PY*2 + maxRows*RH, 120);
  const paths = edges.map(e => {
    const a = pos.get(e.from), b = pos.get(e.to); if (!a || !b) return "";
    const x1=a._x+NW, y1=a._y+NH/2, x2=b._x-3, y2=b._y+NH/2, mx=(x1+x2)/2;
    const back = b._x <= a._x;   // cycle / same-column edge → dim it
    const dash = e.kind === "member" ? ` stroke-dasharray="5 4"` : "";
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none"
      stroke="var(--pl-color-fg-muted,#8a8f98)" stroke-width="1.4" stroke-opacity="${back?0.35:0.8}"${dash}
      marker-end="url(#arw)"/>`;
  }).join("");
  const rects = nodes.map(n => {
    const self0 = n.id === self, sel = n.id === SELECTED, down = n.up === false;
    const stroke = self0 ? CLR.accent : (down ? CLR.down : CLR.border);
    const op = down ? 0.6 : 1;   // only a KNOWN failure is dimmed; unknown stays legible
    const ver = n.version ? ` v${esc(n.version)}` : "";
    const badge = (KINDS.find(k => k.kind === n.kind) || {}).badge;
    // Top-right is one slot: an agent's latency, or a leaf's type tag. A leaf's latency
    // (an ACP handshake, a /models call) is its owner's number and belongs in the panel.
    const tag = badge
      ? `<text x="${n._x+NW-8}" y="${n._y+16}" font-size="8.5" text-anchor="end" letter-spacing="0.6"
           fill="${CLR.muted}">${badge}</text>`
      : (Number.isFinite(n.latency_ms)
        ? `<text x="${n._x+NW-8}" y="${n._y+16}" font-size="9.5" text-anchor="end" fill="${CLR.muted}">${n.latency_ms}ms</text>` : "");
    return `<g class="node${sel?" sel":""}" data-id="${esc(n.id)}" opacity="${op}">
      <rect x="${n._x}" y="${n._y}" width="${NW}" height="${NH}" rx="8"
        fill="var(--pl-color-bg,#0b0d10)" stroke="${stroke}" stroke-width="${self0||sel?2:1}"/>
      <circle cx="${n._x+13}" cy="${n._y+16}" r="4" fill="${dotColor(n)}"/>
      <text x="${n._x+24}" y="${n._y+19}" font-size="12.5" font-weight="600" fill="var(--pl-color-fg,#e6e6e6)">${esc(clip(n.name, badge ? 15 : 19))}</text>
      ${tag}
      <text x="${n._x+11}" y="${n._y+37}" font-size="10" fill="${CLR.muted}">${esc(clip(n.role,30))}${ver}</text>
    </g>`;
  }).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="var(--pl-color-fg-muted,#8a8f98)"/></marker></defs>
    ${paths}${rects}</svg>`;
}
function clip(s, n){ s = String(s || ""); return s.length > n ? s.slice(0, n-1) + "…" : s; }

// ── detail panel (textContent everywhere — names and errors come from remote peers) ─
function panelRows(n){
  const rows = [["Status", statusText(n)]];
  if (n.kind === "coder"){
    // A coder is a subprocess on ITS owner's box, so WHICH box is the identifying fact.
    const owner = (TOPO.nodes || []).find(o => o.id === n.owner);
    rows.push(["Command", n.command || "—", "mono"], ["Workdir", n.workdir || "—", "mono"],
              ["Runs on", n.id.startsWith("acp:" + TOPO.self + "#") ? "this agent" : (owner?.name || n.owner || "—")]);
  } else if (n.kind === "model"){
    rows.push(["Endpoint", n.endpoint || "—", "mono"], ["Model", n.model || "—", "mono"]);
  } else {
    rows.push(["URL", n.url || "—", "link"], ["Version", n.version || "—"]);
  }
  if (Number.isFinite(n.latency_ms)) rows.push(["Latency", n.latency_ms + " ms"]);
  if (Number.isFinite(n.checked_at)) rows.push(["Checked", fmtAge(n.checked_at)]);
  if (n.error) rows.push(["Error", n.error]);
  const ins = (TOPO.edges || []).filter(e => e.to === n.id).length;
  if (n.kind === "agent" || n.kind === "self"){
    const out = (TOPO.edges || []).filter(e => e.from === n.id).length;
    rows.push(["Delegates", out ? out + " outbound" : (n.kind === "self" ? "0" : "unknown (no token)")]);
  }
  rows.push(["Delegated by", ins + (ins === 1 ? " agent" : " agents")]);
  return rows;
}
function showPanel(id){
  const n = (TOPO?.nodes || []).find(n => n.id === id);
  if (!n){ hidePanel(); return; }
  SELECTED = id;
  const name = $("p-name");
  name.textContent = n.name || n.id;
  const badge = (KINDS.find(k => k.kind === n.kind) || {}).badge;
  if (badge){ const t = document.createElement("span"); t.className = "kindtag"; t.textContent = badge; name.appendChild(t); }
  $("p-role").textContent = n.role || "";
  const dl = $("p-rows");
  dl.textContent = "";
  for (const [label, value, style] of panelRows(n)){
    const dt = document.createElement("dt"); dt.textContent = label;
    const dd = document.createElement("dd");
    if (style === "mono") dd.className = "mono";
    if (style === "link" && /^https?:\/\//.test(value)){
      const a = document.createElement("a"); a.href = value; a.target = "_blank"; a.rel = "noreferrer";
      a.textContent = value; dd.appendChild(a);
    } else dd.textContent = value;
    dl.append(dt, dd);
  }
  $("panel").hidden = false;
  render();
}
function hidePanel(){ SELECTED = null; $("panel").hidden = true; render(); }
$("panel-close").addEventListener("click", hidePanel);
$("graph").addEventListener("click", (ev) => {
  const g = ev.target.closest("g.node");
  if (g) showPanel(g.dataset.id);
});

// Chips are rebuilt only when the CLASSES on the chart change, not on every 8s poll —
// re-creating the buttons under a keyboard user mid-poll would eat their focus.
let filterSig = null;
function renderFilters(){
  const counts = {};
  for (const n of TOPO.nodes || []) if (n.kind !== "self") counts[n.kind] = (counts[n.kind] || 0) + 1;
  const inc = TOPO.include || {};
  const sig = JSON.stringify([counts, inc]);
  if (sig === filterSig) return;
  filterSig = sig;
  const box = $("filters");
  box.textContent = "";
  for (const k of KINDS){
    const n = counts[k.kind] || 0;
    if (!n) continue;                       // a class with nothing in it is noise, not a control
    const b = document.createElement("button");
    b.className = "chip-btn";
    b.type = "button";
    const paint = () => {
      const shown = !HIDDEN.has(k.kind);
      b.setAttribute("aria-pressed", String(shown));
      b.title = (shown ? "Hide " : "Show ") + k.label.toLowerCase();
    };
    b.append(document.createTextNode(k.label));
    const c = document.createElement("span"); c.className = "n"; c.textContent = String(n);
    b.appendChild(c);
    paint();
    b.addEventListener("click", () => {
      if (HIDDEN.has(k.kind)) HIDDEN.delete(k.kind); else HIDDEN.add(k.kind);
      store.set(HIDDEN);
      paint();
      $("graph").innerHTML = draw(TOPO);    // the chips are already correct — redraw only the graph
      updateSummary();
    });
    box.appendChild(b);
  }
  // "Where is my coder?" is answered here rather than by a chart that just omits it.
  const off = [];
  if (inc.acp === false) off.push("Coding agents");
  if (inc.model === false) off.push("model endpoints");
  if (off.length){
    const note = document.createElement("span");
    note.className = "note";
    note.textContent = off.join(" and ") + " are excluded in Settings → Org Chart.";
    box.appendChild(note);
  }
}

function updateSummary(){
  if (!TOPO) return;
  const { nodes, edges } = visible(TOPO);
  const up = nodes.filter(n => n.up === true).length;
  const hidden = (TOPO.nodes || []).length - nodes.length;
  $("summary").innerHTML = `<b>${nodes.length}</b> node${nodes.length===1?"":"s"} · <b>${up}</b> up · ` +
    `<b>${edges.length}</b> edge${edges.length===1?"":"s"}` + (hidden ? ` · ${hidden} hidden` : "");
}

function render(){
  if (!TOPO) return;
  renderFilters();
  updateSummary();
  $("graph").innerHTML = draw(TOPO);
}

function fmtAge(ts){
  const s = Math.max(0, Math.round(Date.now()/1000 - ts));
  // Rolls over past minutes: the health prober backs off to 15-minute sweeps when
  // nobody is watching, and a "Checked" of `526822m ago` is not a legible number.
  if (s < 5) return "just now";
  if (s < 90) return s + "s ago";
  const m = Math.round(s/60);
  if (m < 90) return m + "m ago";
  const h = Math.round(m/60);
  return h < 36 ? h + "h ago" : Math.round(h/24) + "d ago";
}

async function load(force){
  try {
    $("err").hidden = true;
    const topo = await api("/api/plugins/orgchart/topology" + (force ? "?refresh=1" : ""));
    TOPO = topo;
    POLL_S = Number(topo.poll_s) > 0 ? Number(topo.poll_s) : POLL_S;
    const fresh = $("freshness");
    fresh.className = "chip" + (topo.stale ? " stale" : "");
    fresh.textContent = (topo.stale ? "refreshing · " : "") + (topo.generated_at ? "crawled " + fmtAge(topo.generated_at) : "");
    render();
    if (topo.stale) setTimeout(() => { if (!document.hidden) load(); }, 2500);  // pick up the background rebuild
  } catch(e){
    $("err").hidden = false;
    $("err").textContent = "Could not load topology: " + e;
  }
}

$("refresh").addEventListener("click", async () => {
  const b = $("refresh"); b.disabled = true;
  try { await load(true); } finally { b.disabled = false; }
});

// Poll while visible; a hidden tab crawls nothing (the server cache goes cold on its own).
function schedule(){
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) load(); }, POLL_S * 1000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(); schedule(); } });

let booted = false;
function boot(){ if (booted) return; booted = true; load().then(schedule); }
kit.initPluginView(boot);
setTimeout(boot, 800);
</script></body></html>
