id: workflows
name: Workflows
version: 0.3.0
description: >-
  Declarative, multi-step subagent workflows (ADR 0002) — chain subagent steps
  (some in parallel) into repeatable recipes, with the Studio console surface for
  authoring and live-watching runs. Lives as a plugin (lean core); the engine taps
  core via the plugin SDK (graph.sdk.run_subagent), never core internals.
enabled: true             # first-party — GA, shipped on (disable via plugins.disabled)
config:
  # Terminal-run retention: `.runs/` keeps this many done/failed records (paused and
  # running runs are never pruned — they're resumable state, not history).
  max_runs: 200
settings:
  - { key: max_runs, label: "Runs kept", type: number, description: "How many finished workflow runs to keep in history; the oldest are pruned past this." }
capabilities:
  network: []
  filesystem: scoped      # recipe dir in the instance data dir
# The Studio console surface is a first-party native-React view registered through the
# src/ext build-time seam (ADR 0038 D3), gated on this plugin being enabled — not an
# iframe view declared here.
