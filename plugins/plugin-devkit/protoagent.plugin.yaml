id: plugin-devkit
name: Plugin Devkit
version: 0.7.0
description: >-
  The plugin-authoring kit + the canonical reference plugin. It demonstrates EVERY
  contribution type in one repo — tools (`scaffold_plugin`, `plugin_read_file`,
  `plugin_write_file`, `test_plugin`, `reload_plugins`, …), a subagent
  (`plugin-architect`), a bundled `SKILL.md` skill, a workflow (`design-plugin`),
  a console view, config/settings, and an event-bus emit (ADR 0039) — and it closes
  the ADR 0096 self-building loop: the agent scaffolds a plugin, edits it, runs its
  pytest suite, and hot-swaps it into itself — no restart. Enable it, then ask the
  agent to build a plugin.
enabled: false

# Declarative (surfaced, not enforced): scaffold_plugin writes plugin skeletons
# into the live plugins dir.
capabilities:
  network: []
  filesystem: scoped

# `test_plugin` spawns `<python> -m pytest` (ADR 0096 D3). A source run has pytest
# in its own venv, but the frozen desktop app does not: the app bundle carries no
# pytest, and the managed runtime's baseline is the ADR 0092 *document* stack. So
# declare it — the frozen dep path (and the Plugins panel's "Install deps") then
# puts pytest in the managed runtime, which is what closes the self-building loop
# on desktop. `runtime` scope (the default) is correct and deliberate: pytest is
# only ever invoked as a SUBPROCESS of the managed interpreter, never imported
# into the host process, so a `host` scope would refuse the frozen install for a
# requirement that does not exist.
requires_pip:
  - "pytest>=8"

# Config + Settings (ADR 0019) — where scaffolded plugins are written, and which
# ACP coding delegate develop_plugin dispatches to (ADR 0096 D5).
config_section: plugin_devkit
config:
  target_dir: ""
  coder: ""
settings:
  - { key: target_dir, label: "Scaffold target dir", type: string, description: "Where scaffold_plugin writes new plugins (blank = the live plugins dir)." }
  - { key: coder, label: "Coding delegate", type: string, description: "The acp delegate develop_plugin dispatches to (blank = the sole configured acp delegate)." }

# Event bus (ADR 0039) — the topics this plugin broadcasts (declared for discovery).
emits:
  - plugin-devkit.scaffolded

# Console view (ADR 0026/0038) — a quick-reference card. The PAGE is served on the
# PUBLIC /plugins/<id> prefix: an iframe page-load can't carry a bearer, so the page
# must NOT be bearer-gated (data routes, if any, ride /api/plugins/<id>).
views:
  - { id: devkit, label: "Plugin Devkit", icon: Boxes, path: /plugins/plugin-devkit/status }
