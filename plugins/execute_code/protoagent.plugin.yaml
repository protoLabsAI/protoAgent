id: execute_code
name: Execute Code
version: 0.1.0
description: >-
  A Python interpreter the agent runs code in — its headline use is programmatic
  tool-calling (call several tools, compose the results in code, return only what
  matters). It runs arbitrary model-authored code: a scrubbed-env subprocess with
  a hard timeout is isolation, not a true sandbox (code can reach disk/network as
  the server user), so its own manifest ships disabled. The bundled cowork
  pack (on by default) turns it on for its document skills; turn it off with
  `plugins.disabled: [execute_code]`, which always wins.
enabled: false

# Declarative (not yet enforced) — surfaced in the console for transparency.
capabilities:
  network: []
  filesystem: workspace
  subprocess: ["python"]

# Plugin config (ADR 0019) — claims the top-level `execute_code` config section
# (the same one the core tool used, so existing `execute_code:` YAML carries
# over). Renders in Settings (group "Execute Code"). NOTE: enabling the tool is
# now `plugins.enabled: [execute_code]`, not an `execute_code.enabled` flag.
config_section: execute_code
config:
  timeout: 30.0
  output_truncate: 6000
  tools: []
  extra_tools: []
  session_state: false
  kernel_idle_ttl: 600
  max_kernels: 4
settings:
  - { key: session_state, label: "Keep state across a session's runs (experimental)", type: bool, description: "EXPERIMENTAL (ADR 0134, default off). When on, the first execute_code call in a session starts a long-lived Python kernel keyed by session; later calls run in its globals, so variables, imports and functions carry over — fetch a large result once and filter it again without re-fetching or re-printing it. State is lost when a call times out or the kernel restarts, and never survives a server restart. A call can pass fresh=true to start from a clean slate. Off keeps today's behaviour: every call runs in a fresh subprocess with no state." }
  - { key: kernel_idle_ttl, label: "Session kernel idle timeout (s)", type: number, description: "ADR 0134 D2. Only when session kernels are on. A session kernel left unused this many seconds is stopped and its state discarded, so an idle or forgotten chat never keeps a Python process alive; the next call in that session gets a fresh kernel (prefixed `new kernel: no earlier state`). Default 600 (10 min)." }
  - { key: max_kernels, label: "Max concurrent session kernels", type: number, description: "ADR 0134 D2. Only when session kernels are on. The most session kernels this instance keeps running at once; starting one past the cap first stops the least-recently-used kernel (its state is lost). Default 4." }
  - { key: timeout, label: "Script timeout (s)", type: number, description: "Hard timeout (seconds) before the subprocess is killed." }
  - { key: output_truncate, label: "Output truncate (chars)", type: number, description: "Max characters of stdout returned inline. When stdout exceeds this, the head is returned with a marker and the FULL output is spilled to a scratch file under the plugin store (spill/) whose absolute path the marker names. Recover the rest with a PAGED read that starts past the head (offset = this limit, one page at a time) so each follow-up returns fresh tail and never re-spills. Spill files are capped at 5 MB and pruned after 24h; a failed spill falls back to plain truncation." }
  - { key: tools, label: "Exposed tools", type: string_list, description: "Tools the script may call. Empty means the curated read-only default set (ADR 0103 D3); a non-empty list REPLACES that default with exactly the names you list." }
  - { key: extra_tools, label: "Additional exposed tools", type: string_list, description: "Bridge these tools IN ADDITION to whichever set above applies (union, not replace) — e.g. a plugin read tool like github_search_issues, without re-listing every core tool. Unregistered names are ignored; execute_code can't bridge itself." }
