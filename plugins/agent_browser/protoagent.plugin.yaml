id: agent_browser
name: Agent Browser
# Bundled into core (#3451) from the retired agent-browser-plugin repo, whose last tag was
# v0.6.4 (main was 0.6.5 + unreleased work). The bundled version MUST stay strictly above
# every release of a superseded repo: a copy that loses its plugins.lock row becomes
# untracked, and an untracked copy that isn't OLDER than the bundled one wins (#1574).
# 0.7.0 is that floor.
version: 0.7.0
description: >-
  Browser automation for protoAgent, backed by **agent-browser** (vercel-labs) — a
  fast native-Rust CLI/daemon that drives Chrome over CDP with accessibility-tree
  snapshots and compact `@eN` element refs. Wraps the CLI as tools (open, snapshot,
  click, fill, type, screenshot, pdf, …), ships a discovery skill that defers to the
  CLI's always-current workflow content, browser workflows, and a **Browser panel**
  console view — a fully interactive, drivable viewport (live CDP screencast + mouse/
  keyboard/scroll over a gated same-origin WebSocket), so you can click and type in the
  page alongside the agent.

  The **`agent-browser`** CLI installs itself: with none on PATH, the plugin downloads
  the pinned, checksum-verified release on first use (or from the setup banner's
  **Download agent-browser** button), and the banner's **Install Chrome** button fetches
  the browser it drives. An `npm i -g agent-browser` install on PATH still wins. Ships
  DISABLED; enable with `plugins: { enabled: [agent_browser] }`.
# Bundled but OPT-IN: the pack contributes 21 tools and drives a real browser at
# `network: ["*"]`, so it turns on deliberately — never by shipping.
enabled: false
# The standalone repo this bundled copy retires (#3445). An installed copy that
# plugins.lock records as fetched from it stands down in favour of this one — at any
# version — and installing/updating from that URL (directly or as a bundle member, which
# is how the bundle template and several archetypes still list it) is skipped rather than
# refused. Enabled state, the `agent_browser` config section and every archetype's enable
# list keep working because the id did not change.
supersedes:
  - https://github.com/protoLabsAI/agent-browser-plugin

# Plugin config (read from `agent_browser:` in langgraph-config.yaml).
config_section: agent_browser
config:
  binary: agent-browser     # the agent-browser CLI on PATH (override for a pinned path)
  cli_autofetch: true       # no CLI on PATH → download the PINNED, sha256-verified release on
                            # first use (cli_fetch.py). The banner's Download button works
                            # either way; Chrome is only ever installed from its own button.
  timeout_s: 60             # per-command subprocess timeout
  max_response_bytes: 200000  # aggregate stdout+stderr byte cap per command; untrusted page
                            # output is read only up to this; snapshot/get text/html return the
                            # first part marked "…[truncated: …]", other tools a bounded error
                            # (memory + model-context safety). Read/enforced by the plugin wrapper.
  session_scope: shared     # how the agent-browser SESSION is scoped across concurrent chats
                            # (#4509): `shared` (default) = one session for everyone, which the
                            # console Browser panel + screencast follow; `per_session` = each
                            # chat session drives its own page, so two chats at once don't land
                            # on each other's tab. Opt-in: the panel still follows the shared
                            # session, so per_session leaves the operator's live view on it.
                            # Either way the browser is THIS instance's own: the plugin names the
                            # CLI session from the instance (`pa-<instance>-<hash>`), so two
                            # agents on one machine never share a Chrome or its cookies. An
                            # AGENT_BROWSER_SESSION env var set by the operator overrides it.
  idle_timeout_min: 30      # per_session chat browsers shut down (Chrome and all) after this many
                            # minutes with no browser command; 0 = never. The CLI's own reaper
                            # (AGENT_BROWSER_IDLE_TIMEOUT_MS), applied when a browser starts.
  main_idle_timeout_min: 0  # the same for the instance's MAIN browser (shared scope + the panel).
                            # Default never: the operator's signed-in tabs live there, and the
                            # panel's live view doesn't count as activity, so a timeout would
                            # close the browser under someone watching it.
  home_url: ""              # homepage the panel opens to. When set, the panel auto-opens it if
                            # no browser page is open; the empty state also shows a Start button.
                            # Blank → the Start button opens about:blank (no auto-open).
  stream_quality: 80        # interactive panel JPEG quality (1–100). Higher = crisper, more data.
                            # (The panel also renders at your dock's size × device-pixel-ratio.)
  # Runtime / launch options — a curated set passed to `agent-browser open` so you can
  # shape and lock down the browser the agent spins up. Blank/0/false = CLI default.
  headed: false             # show a real browser window instead of headless
  profile: ""               # path to a browser profile dir (isolation + persisted auth/cookies)
  device: ""                # device emulation, e.g. "iPhone 16 Pro"
  allowed_domains: ""       # comma-separated navigable-domain whitelist (e.g. "example.com,*.foo.com")
  confirm_actions: submit   # the action gate (gate.py): which consequential actions need the
                            # operator's approval card first — submit (form submissions and
                            # controls named Submit/Send/Pay/Delete/…), eval, upload, download,
                            # all; "" or none = off. Unset = submit. Enforced by the plugin
                            # (it resolves the real target, @eN refs included), not the CLI.
  max_output: 0             # cap page-text output chars (LLM-safety); 0 = CLI default
  content_boundaries: true  # wrap page-derived output (snapshot / get_text / get_html /
                            # form_read; eval stays raw) in the CLI's AGENT_BROWSER_PAGE_CONTENT markers so the
                            # model can tell page data from instructions (boundaries.py). Passed
                            # per call, never globally: a wrapped internal eval breaks the form tools.
  detect_walls: true        # after browser_open, report a bot check / block page / sign-in wall
                            # as `Error: blocked by …` with a hand-to-the-user line (walls.py)
  # Anti-detection — help pages that block automated/headless browsers (Google, Reddit,
  # Cloudflare, …). No setting defeats detection entirely; headed + a logged-in `profile`
  # is the most reliable combination. Applied at session launch (the first open).
  stealth: false            # drop the navigator.webdriver automation flag; when headless, also
                            # swap the "HeadlessChrome" User-Agent for a real desktop Chrome one
  user_agent: ""            # override the User-Agent (blank → CLI default; stealth may set one)
  browser_args: ""          # extra Chrome launch args, comma/newline separated
                            # (e.g. "--disable-blink-features=AutomationControlled")

# Editable in Settings ▸ Plugins (ADR 0019) — the operator knobs above as UI fields.
settings:
  - { key: home_url, label: "Homepage URL", type: string, description: "The page the interactive panel opens to. When set, it auto-opens if no browser page is open, and the empty state shows a Start button. Blank = a Start button that opens about:blank." }
  - { key: stealth, label: "Anti-detection (stealth)", type: bool, description: "Help pages that block automated/headless browsers (Google, Reddit, Cloudflare). Drops the navigator.webdriver flag and, when headless, uses a real desktop User-Agent. Most reliable paired with Headed + a logged-in Browser profile. No setting defeats detection entirely." }
  - { key: headed, label: "Headed browser", type: bool, description: "Show a real browser window instead of running headless. Also far less bot-detectable than headless." }
  - { key: user_agent, label: "User-Agent override", type: string, description: "Override the browser User-Agent. Blank = CLI default (stealth may set a realistic one when headless)." }
  - { key: browser_args, label: "Extra Chrome args", type: string, description: "Extra Chrome launch args, comma/newline separated (e.g. --disable-blink-features=AutomationControlled)." }
  - { key: allowed_domains, label: "Allowed domains", type: string, description: "Comma-separated navigable-domain allowlist (e.g. example.com,*.foo.com). Blank = unrestricted." }
  - { key: confirm_actions, label: "Confirm actions", type: string, description: "Which browser actions need your approval first, comma-separated: submit (submitting a form, or a button like Send, Place order, Pay or Delete), eval (running JavaScript), upload, download, or all. Leave empty or type none to turn approvals off. Default: submit." }
  - { key: profile, label: "Browser profile dir", type: string, description: "Path to a browser profile directory — isolation + persisted auth/cookies across sessions. Reusing a logged-in Chrome profile is the most reliable way past login walls." }
  - { key: device, label: "Device emulation", type: string, description: "Emulate a device, e.g. \"iPhone 16 Pro\". Blank = desktop." }
  - { key: stream_quality, label: "Panel stream quality", type: number, description: "Interactive panel JPEG quality (1–100). Higher = crisper, more bandwidth. The panel also renders at your dock's size × device-pixel-ratio." }
  - { key: content_boundaries, label: "Mark page content as untrusted", type: bool, description: "Wrap the page text, HTML, snapshots and form reads the agent gets in boundary markers, so text from a web page is treated as data, never as instructions. Recommended on." }
  - { key: detect_walls, label: "Detect bot checks and sign-in walls", type: bool, description: "After opening a page, notice when a bot check (Cloudflare, CAPTCHA…), a block page or a sign-in page showed up instead, and ask you to clear it in the Browser panel rather than carrying on." }
  - { key: max_output, label: "Max page-text output (chars)", type: number, description: "Cap characters of page text returned to the model (LLM-safety). 0 = the CLI default." }
  - { key: timeout_s, label: "Command timeout (s)", type: number, description: "Per-command subprocess timeout for the browser tools." }
  - { key: max_response_bytes, label: "Max response bytes", type: number, description: "Aggregate stdout+stderr byte cap per browser command. Reading stops at the cap, which protects process memory and the model's context from unbounded page content. The snapshot and get text/html tools return the first part, marked as truncated; other tools return a short error. Default 200000." }
  - { key: binary, label: "agent-browser binary", type: string, description: "The agent-browser CLI on PATH (override with a pinned absolute path if needed)." }
  - { key: cli_autofetch, label: "Download the CLI on first use", type: bool, description: "When no agent-browser CLI is on PATH, download the pinned, checksum-verified release the first time the browser is used. Off = install it yourself (npm i -g agent-browser) or use the setup banner's Download button. Chrome is never downloaded automatically." }
  - { key: session_scope, label: "Session scope", type: string, description: "How the browser session is scoped across concurrent chats. 'shared' (default) = one browser for this agent, which the console Browser panel and screencast follow. 'per_session' = each chat session drives its own browser so two chats at once don't share one page — the panel still follows the shared one. Either way, other agents on this machine have their own browsers. A Browser profile dir can back only one browser at a time, so with per_session only one chat can use it at once." }
  - { key: idle_timeout_min, label: "Close idle chat browsers after (min)", type: number, description: "With session scope 'per_session', each chat's browser shuts down after this many minutes without a browser command, so finished chats don't keep a Chrome running. 0 = never. Takes effect for browsers started after the change." }
  - { key: main_idle_timeout_min, label: "Close the main browser when idle after (min)", type: number, description: "The same for this agent's main browser (the one the Browser panel shows). 0 (default) = never — your signed-in tabs live there, and watching the panel doesn't count as activity. Takes effect the next time the browser starts." }

# Console view (ADR 0026) — an interactive, drivable browser viewport (CDP screencast + input).
views:
  - { id: panel, label: "Browser", icon: Globe, path: /plugins/agent_browser/panel }

# Declarative only (surfaced for review).
capabilities:
  network: ["*"]            # the browser navigates arbitrary URLs
  filesystem: scoped        # ENFORCED (#3451): browser_screenshot / browser_pdf write only
                            # inside this plugin's own instance store (sdk.plugin_store),
                            # and a traversing/absolute path is refused, not redirected.
